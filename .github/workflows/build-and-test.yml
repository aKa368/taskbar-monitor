name: build-and-test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore
        run: dotnet restore TaskbarMonitor.sln --locked-mode

      - name: Build
        run: dotnet build TaskbarMonitor.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test TaskbarMonitor.sln --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Test with coverage
        run: dotnet test TaskbarMonitor.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

      - name: Upload coverage report
        if: always() && hashFiles('artifacts/coverage/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_number }}
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Check formatting
        run: dotnet format TaskbarMonitor.sln --verify-no-changes --no-restore

      - name: Check .slnx covers every project in .sln
        shell: pwsh
        run: |
          $sln = Select-String -Path TaskbarMonitor.sln -Pattern '"((?:src|tests)\\[^"]+\.csproj)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $slnx = Select-String -Path TaskbarMonitor.slnx -Pattern 'Path="([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $sln = ($sln | ForEach-Object { $_ -replace '\\','/' } | Sort-Object)
          $slnx = ($slnx | ForEach-Object { $_ -replace '\\','/' } | Sort-Object)
          $missing = Compare-Object $sln $slnx | Where-Object { $_.SideIndicator -eq '<=' } | ForEach-Object { $_.InputObject }
          if ($missing) {
            Write-Error "Projects in .sln missing from .slnx: $($missing -join ', ')"
            exit 1
          }

      - name: Check vulnerable packages
        run: dotnet list TaskbarMonitor.sln package --vulnerable --include-transitive

  release:
    name: Package and sign installer
    environment: release-signing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODESIGN_TIMESTAMP_URL: ${{ secrets.CODESIGN_TIMESTAMP_URL }}
      CODESIGN_EXPECTED_PUBLISHER: ${{ secrets.CODESIGN_EXPECTED_PUBLISHER }}
      CODESIGN_EXPECTED_THUMBPRINT: ${{ secrets.CODESIGN_EXPECTED_THUMBPRINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore
        run: dotnet restore TaskbarMonitor.sln --locked-mode

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:\.\d+)?)$') {
            throw "Release tag '$tag' must use the vMAJOR.MINOR.PATCH format."
          }
          $version = $Matches.version
          [xml]$project = Get-Content 'src\TaskbarMonitor.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($version -ne $projectVersion) {
            throw "Tag version '$version' does not match project version '$projectVersion'."
          }
          $releaseRoot = "release-$version"
          $installer = "$releaseRoot/TaskbarMonitor-Setup-v$version-win-x64.exe"
          $summary = "$releaseRoot/signing-summary.json"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_root=$releaseRoot" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "summary=$summary" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained win-x64 payload
        shell: pwsh
        run: |
          $destination = '${{ steps.version.outputs.release_root }}\staging\TaskbarMonitor'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          dotnet publish src\TaskbarMonitor.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $destination `
            --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyReleaseRoot=${{ steps.version.outputs.release_root }}" `
            'installer\TaskbarMonitor.iss'
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed.' }

      - name: Decode code-signing certificate
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64)) {
            throw 'CODESIGN_PFX_BASE64 is not configured for the protected release environment.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'TaskbarMonitor-CodeSigning.pfx'
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          "CODESIGN_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV

      - name: Sign and verify installer
        shell: pwsh
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_PASSWORD)) {
            throw 'CODESIGN_PFX_PASSWORD is not configured for the protected release environment.'
          }
          pwsh -NoProfile -File .\jobs\Sign-Release.ps1 `
            -ArtifactPath '${{ steps.version.outputs.installer }}' `
            -HashOutputPath '${{ steps.version.outputs.installer }}.sha256' `
            -SummaryOutputPath '${{ steps.version.outputs.summary }}'

      - name: Upload signed installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TaskbarMonitor-${{ steps.version.outputs.version }}-signed-win-x64
          path: |
            ${{ steps.version.outputs.installer }}
            ${{ steps.version.outputs.installer }}.sha256
            ${{ steps.version.outputs.summary }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:CODESIGN_PFX_PATH -and (Test-Path -LiteralPath $env:CODESIGN_PFX_PATH)) {
            Remove-Item -LiteralPath $env:CODESIGN_PFX_PATH -Force
          }
