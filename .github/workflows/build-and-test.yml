name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TaskbarMonitor.sln

      - name: Build
        run: dotnet build TaskbarMonitor.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test TaskbarMonitor.sln --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Check vulnerable packages
        run: dotnet list TaskbarMonitor.sln package --vulnerable --include-transitive
